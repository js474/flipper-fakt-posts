name: Taeglicher Fakt-Post

on:
  schedule:
    - cron: "17 8 * * *"   # 08:17 UTC = 09:17 Winterzeit / 10:17 Sommerzeit, Post geht um POST_TIME raus
  push:
    branches: [test-run]   # Push auf diesen Branch = Testlauf als Entwurf
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen, nichts an Metricool senden (1 = ja)"
        default: "0"
      draft:
        description: "Als Entwurf in Metricool anlegen statt veroeffentlichen (1 = ja)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: fakt-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      METRICOOL_USER_ID: "2209069"
      METRICOOL_BLOG_ID: "2740762"
      POST_TIME: "11:47"
      DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
      DRAFT: ${{ github.ref_name == 'test-run' && '1' || github.event.inputs.draft || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0

      - name: Notfall-Auffuellen (unter 3 offene Fakten)
        if: env.DRY_RUN != '1' && env.ANTHROPIC_API_KEY != ''
        run: python refill.py 3

      - name: Fakt rendern
        run: python post.py render

      - name: Bild veroeffentlichen
        if: env.DRY_RUN != '1'
        run: |
          git config user.name "fakt-bot"
          git config user.email "fakt-bot@users.noreply.github.com"
          git add out facts.json processed.json 2>/dev/null || git add out facts.json
          git commit -m "Fakt ${NEXT_ID} gerendert" || echo "nichts zu committen"
          git push
          sleep 20   # Raw-URL braucht einen Moment

      - name: In Metricool einplanen
        run: python post.py schedule

      - name: Status speichern
        if: env.DRY_RUN != '1'
        run: |
          git add facts.json
          git commit -m "Fakt ${NEXT_ID} eingeplant" || echo "nichts zu committen"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: fakt-bild
          path: out/${{ env.NEXT_ID }}.png
