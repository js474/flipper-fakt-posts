name: Woechentlich Fakten auffuellen

on:
  schedule:
    - cron: "23 17 * * 0"   # Sonntag 17:23 UTC
  push:
    branches: [refill-now]  # Push auf diesen Branch = sofort auffuellen
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fakt-post
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fakten aus neuen Blogartikeln ziehen (Ziel 28 offene)
        run: python refill.py 28
      - name: Speichern
        if: always()
        run: |
          git config user.name "fakt-bot"
          git config user.email "fakt-bot@users.noreply.github.com"
          git add facts.json processed.json 2>/dev/null || true
          git commit -m "Fakt-Bank aufgefuellt" || echo "nichts zu committen"
          git pull --rebase origin main
          git push origin HEAD:main
