name: Standbilder aus YouTube

on:
  push:
    branches: [frames]
    paths: [frames/request.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq >/dev/null
          pip install -q yt-dlp
      - name: Video laden
        run: |
          V=$(jq -r .video frames/request.json)
          mkdir -p frames/$V
          yt-dlp -f "bv*[height<=1080][ext=mp4]/bv*[height<=1080]/b" -o "/tmp/v.%(ext)s" "https://www.youtube.com/watch?v=$V" > frames/$V/log.txt 2>&1 || true
          tail -5 frames/$V/log.txt
          ls -la /tmp/v.* >> frames/$V/log.txt 2>&1 || true
      - name: Frames schneiden
        continue-on-error: true
        run: |
          V=$(jq -r .video frames/request.json)
          F=$(ls /tmp/v.* | head -1)
          mkdir -p frames/$V
          TIMES=$(jq -r '.times[]?' frames/request.json)
          if [ -n "$TIMES" ]; then
            for t in $TIMES; do ffmpeg -loglevel error -y -ss "$t" -i "$F" -frames:v 1 -q:v 2 "frames/$V/t$(printf %05d ${t%.*}).jpg"; done
          else
            E=$(jq -r '.every // 20' frames/request.json)
            ffmpeg -loglevel error -i "$F" -vf "fps=1/$E,scale=640:-2" -q:v 4 "frames/$V/s%04d.jpg"
          fi
          ls frames/$V | wc -l
      - name: Speichern
        if: always()
        run: |
          git config user.name "fakt-bot"; git config user.email "fakt-bot@users.noreply.github.com"
          git add frames && git commit -m "Frames $(jq -r .video frames/request.json)" || echo nichts
          git push origin HEAD:frames
